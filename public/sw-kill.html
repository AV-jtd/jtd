<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>JustTODOit · SW Kill</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
      main { width: min(720px, calc(100vw - 32px)); padding: 24px; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 12px; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 16px; color: color-mix(in srgb, CanvasText 70%, transparent); }
      button, a { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); background: Canvas; color: CanvasText; text-decoration: none; cursor: pointer; }
      button.primary { background: CanvasText; color: Canvas; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
      pre { overflow: auto; max-height: 360px; padding: 12px; border-radius: 8px; background: color-mix(in srgb, CanvasText 8%, transparent); font-size: 12px; line-height: 1.5; }
      .ok { color: #059669; }
      .bad { color: #dc2626; }
    </style>
  </head>
  <body>
    <main>
      <h1>Service Worker аварийная очистка</h1>
      <p>Эта страница не использует React и нужна для браузеров, где приложение застряло на старом кэше.</p>
      <div class="row">
        <button class="primary" id="kill">Удалить SW и кэш</button>
        <button id="check">Проверить статус</button>
        <a href="/?__sw_kill=manual">Открыть приложение</a>
      </div>
      <pre id="log">Готово к проверке…</pre>
    </main>
    <script>
      const logEl = document.getElementById('log');
      const write = (msg) => { logEl.textContent += '\n' + msg; };
      const reset = (msg) => { logEl.textContent = msg; };

      async function status() {
        reset('Проверка…');
        write('URL: ' + location.href);
        write('Controller: ' + (navigator.serviceWorker && navigator.serviceWorker.controller ? navigator.serviceWorker.controller.scriptURL : 'нет'));

        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          write('Registrations: ' + regs.length);
          regs.forEach((reg, i) => {
            const worker = reg.active || reg.waiting || reg.installing;
            write('[' + i + '] scope=' + reg.scope);
            write('[' + i + '] script=' + (worker ? worker.scriptURL : 'нет worker'));
            write('[' + i + '] state=' + (worker ? worker.state : 'none'));
          });
        } else {
          write('Service Worker API не поддерживается');
        }

        if ('caches' in window) {
          const keys = await caches.keys();
          write('Caches: ' + (keys.length ? keys.join(', ') : 'пусто'));
        }

        try {
          const res = await fetch('/sw.js?diag=' + Date.now(), { cache: 'no-store' });
          const text = await res.text();
          const kind = text.includes('__sw_kill') && text.includes('registration.unregister') ? 'KILLER' : text.includes('workbox') ? 'WORKBOX/OLD' : 'UNKNOWN';
          write('Server /sw.js: ' + res.status + ' · ' + kind);
          write('First 240 chars: ' + text.slice(0, 240).replace(/\s+/g, ' '));
        } catch (e) {
          write('Не удалось прочитать /sw.js: ' + e.message);
        }
      }

      async function kill() {
        reset('Удаляю Service Worker и кэши…');
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            write('Найдено SW registrations: ' + regs.length);
            await Promise.all(regs.map((reg) => reg.unregister()));
            write('SW удалены');
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            write('Найдено cache entries: ' + keys.length);
            await Promise.all(keys.map((key) => caches.delete(key)));
            write('Кэши очищены');
          }
          write('Готово. Сейчас открою приложение с cache-buster…');
          setTimeout(() => location.replace('/?__sw_kill=' + Date.now().toString(36)), 900);
        } catch (e) {
          write('Ошибка: ' + e.message);
        }
      }

      document.getElementById('check').addEventListener('click', status);
      document.getElementById('kill').addEventListener('click', kill);
      status();
    </script>
  </body>
</html>
