<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Сброс кэша — JustTODOit</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f5f2;
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --accent: #5c3d2e;
        --card: #ffffff;
        --border: rgba(0, 0, 0, 0.08);
        --ok: #2e7d32;
        --err: #c62828;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14110f;
          --fg: #f5f1ec;
          --muted: #a39c94;
          --accent: #e0b894;
          --card: #1f1a17;
          --border: rgba(255, 255, 255, 0.08);
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg); }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center;
        padding: 24px; -webkit-tap-highlight-color: transparent;
      }
      .card {
        width: 100%; max-width: 460px; background: var(--card);
        border: 1px solid var(--border); border-radius: 18px; padding: 28px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      }
      h1 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
      p { margin: 6px 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
      .icon {
        width: 48px; height: 48px; border-radius: 14px;
        background: color-mix(in srgb, var(--accent) 15%, transparent);
        color: var(--accent); display: flex; align-items: center; justify-content: center;
        margin-bottom: 14px; font-size: 24px;
      }
      ul.steps { list-style: none; padding: 0; margin: 18px 0; font-size: 14px; }
      ul.steps li {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 0; border-bottom: 1px solid var(--border);
      }
      ul.steps li:last-child { border-bottom: none; }
      .status { font-size: 16px; width: 22px; text-align: center; }
      .status.pending { color: var(--muted); }
      .status.ok { color: var(--ok); }
      .status.err { color: var(--err); }
      .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
      button, a.btn {
        flex: 1; min-width: 140px; appearance: none; border: 1px solid var(--border);
        background: var(--accent); color: white; padding: 12px 16px; border-radius: 12px;
        font-size: 15px; font-weight: 500; cursor: pointer; text-align: center;
        text-decoration: none; transition: opacity 0.15s;
      }
      a.btn.ghost { background: transparent; color: var(--fg); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .meta { font-size: 12px; color: var(--muted); margin-top: 14px; word-break: break-all; }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="icon" aria-hidden="true">↻</div>
      <h1>Сброс кэша приложения</h1>
      <p>Очищаем все локальные данные браузера, чтобы устранить «белый экран» после обновления.</p>

      <ul class="steps" id="steps">
        <li><span class="status pending" id="s-sw">·</span> Service Worker</li>
        <li><span class="status pending" id="s-cache">·</span> Cache Storage</li>
        <li><span class="status pending" id="s-storage">·</span> localStorage / sessionStorage</li>
        <li><span class="status pending" id="s-idb">·</span> IndexedDB</li>
      </ul>

      <p id="summary">Запускаем очистку…</p>

      <div class="actions">
        <a class="btn" id="open-app" href="/">Открыть приложение</a>
        <a class="btn ghost" href="/sw-reset.html">Повторить сброс</a>
      </div>

      <p class="meta" id="meta"></p>
    </main>

    <script>
      (function () {
        var setStatus = function (id, ok, label) {
          var el = document.getElementById(id);
          if (!el) return;
          el.className = "status " + (ok ? "ok" : "err");
          el.textContent = ok ? "✓" : "✕";
          if (label) el.title = label;
        };

        var meta = document.getElementById("meta");
        var summary = document.getElementById("summary");
        var openBtn = document.getElementById("open-app");
        openBtn.setAttribute("aria-disabled", "true");
        openBtn.style.pointerEvents = "none";
        openBtn.style.opacity = "0.5";

        var unregisterSW = function () {
          if (!("serviceWorker" in navigator)) {
            setStatus("s-sw", true, "Не поддерживается");
            return Promise.resolve(0);
          }
          return navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
              setStatus("s-sw", true, "Удалено: " + regs.length);
              return regs.length;
            });
          }).catch(function (e) {
            setStatus("s-sw", false, String(e));
            return 0;
          });
        };

        var clearCaches = function () {
          if (!("caches" in window)) {
            setStatus("s-cache", true, "Не поддерживается");
            return Promise.resolve(0);
          }
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); })).then(function () {
              setStatus("s-cache", true, "Удалено: " + keys.length);
              return keys.length;
            });
          }).catch(function (e) {
            setStatus("s-cache", false, String(e));
            return 0;
          });
        };

        var clearStorage = function () {
          try {
            localStorage.clear();
            sessionStorage.clear();
            setStatus("s-storage", true);
            return Promise.resolve();
          } catch (e) {
            setStatus("s-storage", false, String(e));
            return Promise.resolve();
          }
        };

        var clearIndexedDB = function () {
          if (!("indexedDB" in window)) {
            setStatus("s-idb", true, "Не поддерживается");
            return Promise.resolve(0);
          }
          var listDbs = indexedDB.databases ? indexedDB.databases() : Promise.resolve([
            // Fallback for Safari/Firefox: known DBs used by the app.
            { name: "tanstack-query" },
            { name: "keyval-store" },
            { name: "localforage" },
          ]);
          return listDbs.then(function (dbs) {
            return Promise.all((dbs || []).map(function (db) {
              if (!db || !db.name) return null;
              return new Promise(function (resolve) {
                try {
                  var req = indexedDB.deleteDatabase(db.name);
                  req.onsuccess = req.onerror = req.onblocked = function () { resolve(); };
                } catch (e) { resolve(); }
              });
            })).then(function () {
              setStatus("s-idb", true, "Удалено: " + (dbs || []).length);
              return (dbs || []).length;
            });
          }).catch(function (e) {
            setStatus("s-idb", false, String(e));
            return 0;
          });
        };

        Promise.all([unregisterSW(), clearCaches(), clearStorage(), clearIndexedDB()])
          .then(function (counts) {
            summary.textContent = "Готово. Можно открыть приложение.";
            meta.textContent =
              "SW: " + counts[0] + " · caches: " + counts[1] +
              " · idb: " + counts[3] + " · " + new Date().toLocaleTimeString();
            openBtn.removeAttribute("aria-disabled");
            openBtn.style.pointerEvents = "";
            openBtn.style.opacity = "";
            // Cache-bust the redirect target so Safari can't serve a memory-cached HTML.
            openBtn.setAttribute("href", "/?_r=" + Date.now().toString(36));
          })
          .catch(function (e) {
            summary.textContent = "Очистка завершена с ошибками.";
            meta.textContent = String(e);
            openBtn.removeAttribute("aria-disabled");
            openBtn.style.pointerEvents = "";
            openBtn.style.opacity = "";
          });
      })();
    </script>
  </body>
</html>
