<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Колода маркетолога — 50 фреймворков</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f3f0; --surface:#fcfcfb; --surface-2:#f0efec;
  --ink:#141413; --ink-2:#52514e; --ink-3:#8a8880;
  --line:#e0dfdb; --line-2:#cfcec9;
  --accent:#2a78d6;
  --c-strategy:#2a78d6; --c-brand:#4a3aa7; --c-customer:#1baf7a;
  --c-growth:#eb6834; --c-money:#008300; --c-comms:#e87ba4;
  --shadow:0 1px 2px rgba(20,20,19,.06), 0 8px 24px -12px rgba(20,20,19,.18);
  --r:14px;
}
html[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232322;
  --ink:#f7f7f5; --ink-2:#c3c2b7; --ink-3:#8d8c85;
  --line:#2f2f2d; --line-2:#3d3d3a;
  --accent:#3987e5;
  --c-strategy:#3987e5; --c-brand:#9085e9; --c-customer:#199e70;
  --c-growth:#d95926; --c-money:#3ea63e; --c-comms:#d55181;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:400 16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
header{padding:28px 0 4px}
.brandrow{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
h1{font-size:clamp(24px,5.2vw,34px);line-height:1.1;margin:0;letter-spacing:-.02em;font-weight:650}
.sub{color:var(--ink-2);font-size:14px;margin:8px 0 0;max-width:52ch}
.iconbtn{
  flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);cursor:pointer;font-size:16px;line-height:1;
  display:grid;place-items:center;transition:.15s;
}
.iconbtn:hover{border-color:var(--line-2);color:var(--ink)}

/* ---------- controls ---------- */
.controls{position:sticky;top:0;z-index:30;background:var(--bg);padding:14px 0 10px;margin-top:14px}
.controls:before{content:"";position:absolute;inset:auto 0 -14px 0;height:14px;background:linear-gradient(var(--bg),transparent);pointer-events:none}
.searchrow{display:flex;gap:8px}
.search{
  flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;padding:0 12px;height:44px;
}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.search svg{flex:none;opacity:.5}
.search input{flex:1;border:0;background:none;outline:none;color:var(--ink);font-size:16px;min-width:0}
.search input::placeholder{color:var(--ink-3)}
.dice{flex:none;height:44px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;font-size:14px;white-space:nowrap}
.dice:hover{color:var(--ink);border-color:var(--line-2)}

.chips{display:flex;gap:7px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;display:inline-flex;align-items:center;gap:7px;height:33px;padding:0 13px;
  border-radius:999px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-2);font-size:13.5px;cursor:pointer;white-space:nowrap;transition:.15s;
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.9}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip:not([aria-pressed="true"]):hover{border-color:var(--line-2);color:var(--ink)}
.count{color:var(--ink-3);font-size:13px;margin:12px 0 0}

/* ---------- grid ---------- */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin:14px 0 48px}
.card{
  position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:16px 16px 15px;cursor:pointer;transition:.16s;
  display:flex;flex-direction:column;gap:8px;color:inherit;font:inherit;overflow:hidden;
}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cc)}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-2)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card .num{position:absolute;top:13px;right:14px;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.card h3{margin:0;font-size:17.5px;font-weight:620;letter-spacing:-.01em;padding-right:26px}
.card .ru{color:var(--ink-3);font-size:12.5px;margin:-4px 0 0;line-height:1.35}
.card p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.45}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin-top:auto;padding-top:4px}
.tag .dot{width:7px;height:7px;border-radius:50%;background:var(--cc)}
.empty{color:var(--ink-3);padding:40px 0;text-align:center}

/* ---------- detail ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(20,20,19,.45);backdrop-filter:blur(3px);display:none}
.overlay.on{display:block}
.sheet{
  position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.sheetinner{max-width:760px;margin:0 auto;padding:0 0 60px}
@media(min-width:800px){.sheetinner{padding:28px 16px 60px}}
.doc{background:var(--surface);border-radius:0;padding:0 0 28px;min-height:100%}
@media(min-width:800px){.doc{border-radius:18px;border:1px solid var(--line);overflow:hidden}}
.dochead{padding:20px 20px 18px;border-bottom:1px solid var(--line);position:relative;background:var(--surface-2)}
.dochead .bar{position:absolute;left:0;top:0;right:0;height:3px;background:var(--cc)}
.navrow{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:9px 12px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.navrow .sp{flex:1}
.nb{height:34px;min-width:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;font-size:14px;display:grid;place-items:center}
.nb:hover{color:var(--ink)}
.nb[disabled]{opacity:.35;cursor:default}
.pos{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
h2{margin:0;font-size:clamp(22px,5vw,30px);letter-spacing:-.02em;line-height:1.15;font-weight:650}
.dochead .ru{margin:7px 0 0;color:var(--ink-2);font-size:15px}
.origin{margin:12px 0 0;font-size:12.5px;color:var(--ink-3)}
section{padding:22px 20px 0}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin:0 0 9px;font-weight:600}
.essence{font-size:19px;line-height:1.42;margin:0;letter-spacing:-.01em}
.when{margin:0;font-size:15.5px;line-height:1.5;color:var(--ink);background:var(--surface-2);border-left:3px solid var(--cc);padding:13px 15px;border-radius:0 10px 10px 0}
.ex{margin:0;font-size:15px;line-height:1.55;color:var(--ink-2)}
.ex b{color:var(--ink);font-weight:620}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 0 34px;margin-bottom:11px;font-size:15px;line-height:1.5;color:var(--ink-2)}
ol.steps li:before{
  content:counter(s);position:absolute;left:0;top:0;width:23px;height:23px;border-radius:50%;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-3);
  font-size:11.5px;display:grid;place-items:center;font-variant-numeric:tabular-nums;
}
.pit{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink-2);background:color-mix(in srgb,#e34948 8%,transparent);border:1px solid color-mix(in srgb,#e34948 22%,transparent);padding:13px 15px;border-radius:11px}

/* ---------- viz ---------- */
.viz{background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:16px 14px}
.vz-title{font-size:12px;font-weight:600;overflow-wrap:anywhere}
.vz-note{font-size:11.5px;color:var(--ink-3);line-height:1.35;margin-top:3px;overflow-wrap:anywhere}
.box{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;min-width:0}

/* matrix */
.mx{display:grid;grid-template-columns:13px minmax(0,54px) 1fr 1fr;grid-template-rows:auto 1fr 1fr auto;gap:5px}
.mx-y{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);align-self:center}
.mx-x{text-align:center;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-top:3px}
.mx-h{font-size:10.5px;color:var(--ink-3);text-align:center;padding-bottom:1px;line-height:1.2}
.mx-t{font-size:10.5px;color:var(--ink-3);display:flex;align-items:center;justify-content:flex-end;text-align:right;line-height:1.2;overflow-wrap:anywhere}
.mx .box{min-height:78px;padding:9px 9px}

/* funnel / pyramid */
.fun{display:flex;flex-direction:column;gap:6px;align-items:center}
.fun .box{width:100%;display:flex;flex-direction:column;justify-content:center;text-align:center;border-radius:8px}
.pyr{display:flex;flex-direction:column;gap:6px;align-items:center}
.pyr .box{width:100%;text-align:center;border-radius:8px}

/* flow */
.flow{display:flex;flex-direction:column;gap:0}
.flow .box{width:100%}
.flow .arr{color:var(--cc);text-align:center;font-size:15px;line-height:1;padding:5px 0}
@media(min-width:620px){
  .flow{flex-direction:row;align-items:stretch}
  .flow .box{flex:1;min-width:0}
  .flow .arr{display:flex;align-items:center;padding:0 5px;transform:rotate(-90deg)}
}

/* grid */
.gr{display:grid;gap:7px}
.gr .box{min-height:0}
@media(max-width:520px){.gr{grid-template-columns:repeat(2,1fr)!important}}
@media(min-width:900px){.chips{flex-wrap:wrap}}

/* cycle */
.cyc{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:1}
.cyc svg{position:absolute;inset:0;width:100%;height:100%}
.cnode{
  position:absolute;transform:translate(-50%,-50%);width:33%;text-align:center;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 6px;
  font-size:11.5px;font-weight:600;line-height:1.25;
}
.cnode i{display:block;font-style:normal;font-size:9.5px;color:var(--cc);font-weight:700}
.legend{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:5px}
.legend li{font-size:11.5px;color:var(--ink-3);display:flex;gap:7px;line-height:1.35}
.legend b{color:var(--ink-2);font-weight:650;flex:none}

/* layers */
.lay{width:100%;max-width:270px;margin:2px auto 0}
.ring{position:relative;display:grid;place-items:center;border-radius:50%;
  border:1px solid var(--line-2);background:var(--surface);width:100%;aspect-ratio:1}
.ring>span{position:absolute;top:5%;left:6%;right:6%;text-align:center;font-size:11.5px;font-weight:650;line-height:1.15}
.ring>.ring{width:71%}
.ring>.ring:only-child,.ring .ring .ring{background:color-mix(in srgb,var(--cc) 10%,var(--surface))}

/* table */
.tw{overflow-x:auto;margin:-2px}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:340px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.35}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td:first-child{font-weight:600;color:var(--ink)}
td{color:var(--ink-2)}

/* curve */
.crv{width:100%}
.crv text{font-size:9.5px;fill:var(--ink-3)}
.crv .pl{font-size:10px;fill:var(--ink-2);font-weight:600}

.foot{color:var(--ink-3);font-size:12.5px;text-align:center;padding:0 0 40px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brandrow">
      <div>
        <h1>Колода маркетолога</h1>
        <p class="sub">50 фреймворков. Одна карточка — одно знание: схема, суть, триггер применения, реальный кейс и чек-лист.</p>
      </div>
      <button class="iconbtn" id="theme" title="Сменить тему" aria-label="Сменить тему">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M18.5 5.5l-1.4 1.4M6.9 17.1l-1.4 1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="controls">
    <div class="searchrow">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Найти фреймворк или задачу…" autocomplete="off">
      </label>
      <button class="dice" id="rnd">Случайная</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
  <p class="foot">Стрелки ← → листают карточки, Esc закрывает.</p>
</div>

<div class="overlay" id="ov">
  <div class="sheet" id="sheet"><div class="sheetinner"><div class="doc" id="doc"></div></div></div>
</div>

<script>
const CARDS = [{"id": "swot", "name": "SWOT", "nameRu": "Сильные и слабые стороны, возможности, угрозы", "cat": "strategy", "origin": "Альберт Хамфри, Stanford Research Institute, 1960-е (авторство спорное)", "essence": "Раскладывает позицию компании на то, что внутри под контролем, и то, что снаружи.", "when": "Когда нужно быстро свести разрозненные факты о бизнесе в одну картину перед стратегической сессией или входом на рынок.", "viz": {"type": "matrix", "x": {"label": "Источник", "low": "Внутренний", "high": "Внешний"}, "y": {"label": "Эффект", "low": "Мешает", "high": "Помогает"}, "cells": [{"title": "Strengths", "note": "что уже работает лучше конкурентов"}, {"title": "Opportunities", "note": "сдвиги рынка, которыми можно воспользоваться"}, {"title": "Weaknesses", "note": "внутренние дыры, которые тормозят рост"}, {"title": "Threats", "note": "внешние риски вне вашего контроля"}]}, "example": {"company": "Netflix", "text": "Разбор позиции середины 2000-х: сильная база подписчиков и данные о просмотрах, слабое место — почтовая логистика, возможность — широкополосный интернет, угроза — Blockbuster. Ответ: стриминг в 2007-м."}, "steps": ["Зафиксируй объект анализа: компания, продукт или конкретный рынок.", "Выпиши сильные и слабые стороны только по внутренним факторам.", "Собери возможности и угрозы из рынка, регуляторики, технологий.", "Отбрось всё, что не подтверждается цифрами или фактами.", "Свяжи квадранты попарно: чем сильной стороной закрыть угрозу."], "pitfall": "Превращают в список общих слов вместо решений: матрица заполнена, а из неё ничего не следует."}, {"id": "pestel", "name": "PESTEL", "nameRu": "Шесть групп внешних факторов среды", "cat": "strategy", "origin": "Фрэнсис Агилар, Harvard, 1967 (как ETPS); аббревиатура достроена позже", "essence": "Скан макросреды: перечисляет силы вне отрасли, которые меняют правила игры без вашего участия.", "when": "Когда выходите в новую страну или отрасль и нужно понять, какие внешние силы способны обнулить план.", "viz": {"type": "grid", "cols": 3, "items": [{"title": "Political", "note": "госполитика, субсидии, торговые барьеры"}, {"title": "Economic", "note": "рост, инфляция, курс, ставка"}, {"title": "Social", "note": "демография, ценности, привычки потребления"}, {"title": "Technological", "note": "новые технологии и скорость замещения"}, {"title": "Environmental", "note": "экология, климат, ресурсные ограничения"}, {"title": "Legal", "note": "регулирование, лицензии, защита данных"}]}, "example": {"company": "Uber", "text": "Transport for London не продлил Uber лицензию в 2017-м: причиной стали порядок сообщения о преступлениях, медсправки и инструмент Greyball. Правовой фактор, а не конкуренты, поставил под угрозу крупнейший европейский рынок."}, "steps": ["Очерти границы: страна, отрасль, горизонт три-пять лет.", "Пройди все шесть букв, не пропуская неудобные.", "Для каждого фактора запиши конкретное событие, а не тему.", "Оцени вероятность и силу удара по вашей модели.", "Оставь три-пять факторов и назначь по ним ответственных."], "pitfall": "Собирают энциклопедию новостей вместо факторов, которые реально влияют на вашу экономику и решения."}, {"id": "five-forces", "name": "Porter's Five Forces", "nameRu": "Пять сил конкуренции в отрасли", "cat": "strategy", "origin": "Майкл Портер, Harvard Business Review, 1979", "essence": "Объясняет, почему в одной отрасли прибыль есть, а в другой её съедают пять давлений.", "when": "Когда решаете, стоит ли вообще заходить в отрасль, и хотите оценить структурную прибыльность, а не моду.", "viz": {"type": "grid", "cols": 3, "items": [{"title": "Соперничество", "note": "плотность и агрессия игроков"}, {"title": "Новые игроки", "note": "высота барьеров входа"}, {"title": "Товары-заменители", "note": "чем закроют ту же потребность"}, {"title": "Власть поставщиков", "note": "кто диктует закупочную цену"}, {"title": "Власть покупателей", "note": "легко ли уйти к другому"}]}, "example": {"company": "Ryanair", "text": "В авиаперевозках  "Лезут в диверсификацию, не выжав проникновение: самый дорогой квадрант выбирают из скуки."}, {"id": "bcg", "name": "BCG Matrix", "nameRu": "Портфель продуктов: доля против роста", "cat": "strategy", "origin": "Брюс Хендерсон, Boston Consulting Group, 1970", "essence": "Сортирует продукты по тому, кто генерит кэш, а кто его потребляет ради будущей доли.", "when": "Когда продуктов больше, чем денег, и надо решить, что финансировать, что доить, а что закрывать.", "viz": {"type": "matrix", "x": {"label": "Относительная доля", "low": "Низкая", "high": "Высокая"}, "y": {"label": "Рост рынка", "low": "Низкий", "high": "Высокий"}, "cells": [{"title": "Question Marks", "note": "жрут деньги, исход неясен"}, {"title": "Stars", "note": "растут и требуют вложений"}, {"title": "Dogs", "note": "кандидаты на закрытие"}, {"title": "Cash Cows", "note": "дают кэш на остальных"}]}, "example": {"company": "Procter & Gamble", "text": "С 2014 года P&G продала и свернула около сотни брендов, оставив 65 крупнейших. Кэш от зрелых лидеров вроде Pampers и Tide перенаправили в них же, а не в слабые категории."}, "steps": ["Раздели бизнес на линии с отдельной экономикой.", "Посчитай темп роста рынка по каждой линии.", "Посчитай свою долю относительно крупнейшего конкурента.", "Разнеси линии по квадрантам, размер круга — выручка.", "Назначь каждой роль: инвестировать, доить или закрыть."], "pitfall": "Меряют долю в процентах рынка вместо относительной доли к лидеру, и все продукты кажутся звёздами."}, {"id": "blue-ocean", "name": "Blue Ocean Strategy (ERRC Grid)", "nameRu": "Уход от конкуренции через новую ценность", "cat": "strategy", "origin": "Чан Ким и Рене Моборн, INSEAD, 2005", "essence": "Заставляет убрать привычные атрибуты отрасли и добавить чужие, чтобы конкуренция стала нерелевантной.", "when": "Когда рынок упёрся в ценовую войну и любое улучшение продукта копируют конкуренты за один сезон.", "viz": {"type": "grid", "cols": 2, "items": [{"title": "Eliminate", "note": "какие атрибуты ое из них реально создаёт наценку.", "when": "Когда маржа падает, а непонятно где: нужно найти звено, съедающее издержки или дающее преимущество.", "viz": {"type": "flow", "steps": [{"label": "Входящая логистика", "note": "закупки, сырьё, склад"}, {"label": "Операции", "note": "производство и сборка"}, {"label": "Исходящая логистика", "note": "доставка до точки продажи"}, {"label": "Marketing & Sales", "note": "спрос, цена, каналы"}, {"label": "Сервис", "note": "поддержка и удержание клиента"}]}, "example": {"company": "Zara", "text": "Zara держит дизайн, часть пошива и логистику внутри, а не отдаёт в Азию: коллекция доходит до магазина за недели. Преимущество лежит в звене логистики, а не в дизайне."}, "steps": ["Разбей бизнес на первичные и поддерживающие активности.", "Разнеси реальные издержки и людей по каждому звену.", "Найди звенья, за которые клиент готов доплачивать.", "Сравни свои звенья с цепочкой ближайшего конкурента.", "Реши по каждому: усилить, удешевить или отдать наружу."], "pitfall": "Копируют шаблон Портера, не подгоняя звенья под свою модель: у сервисного бизнеса цепочка другая."}, {"id": "vrio", "name": "VRIO", "nameRu": "Тест ресурса на устойчивое преимущество", "cat": "strategy", "origin": "Джей Барни, 1991 (как VRIN), доработано до VRIO в 1995", "essence": "Прогоняет ресурс через четыре фильтра и отвечает, даёт ли он преимущество надолго.", "when": "Когда команда называет что-то своим преимуществом и нужно проверить, повторит ли это конкурент за год.", "viz": {"type": "flow", "steps": [{"label": "Value", "note": "ресурс создаёт ценность клиенту"}, {"label": "Rarity", "note": "есть ли он у конкурентов"}, {"label": "Imitability", "note": "дорого ли скопировать"}, {"label": "Organization", "note": "умеете ли этим пользоваться"}]}, "example": {"company": "Walmart", "text": "Сеть распределительных центров и cross-docking Walmart проходит все четыре фильтра: ценно, редко, дорого копировать при таком масштабе, и компания выстроила под это операционку. Kmart повторить не смогла."}, "steps": ["Составь список ресурсов: активы, данные, бренд, процессы, люди.", "По каждому ответь на четыре вопроса строго да/нет.", "Останавливайся на первом «нет»: дальше ресурс не проходит.", "Отдели временное преимущество от устойчивого по критерию имитации.", "По прошедшим ресурсам проверь, что оргструктура их использует."], "pitfall": "Записывают в ресурсы всё подряд, включая деньги и покупные технологии: их возьмёт любой конкурент."}, {"id": "stp", "name": "STP", "nameRu": "Сегментация, таргетинг, позиционирование", "cat": "brand", "origin": "Уэнделл Смит (сегментация, 1956), оформил Филип Котлер, 1960–70-е", "essence": "Сначала режешь рынок на группы, выбираешь на ком зарабатывать, потом придумываешь что сказать.", "when": "Когда продукт пытаются продавать всем сразу: сообщение размывается, бюджет уходит на людей, которые никогда не купят.", "viz": {"type": "flow", "steps": [{"label": "Segmentation", "note": "режем рынок на группы"}, {"label": "Оценка сегментов", "note": "размер, рост, доступность"}, {"label": "Targeting", "note": "выбираем, за кого воюем"}, {"label": "Positioning", "note": "что говорим выбранным"}]}, "example": {"company": "Marriott", "text": "Marriott разложил путешественников по ситуации и бюджету и вместо одного бренда запустил Courtyard для командировочных (1983) и Fairfield Inn для экономных (1987) — каждый со своим продуктом и ценой."}, "steps": ["Нарежь рынок по поведению и задаче покупателя, не по демографии.", "Оцени сегменты по размеру, росту, доступности и силе конкурентов.", "Выбери один-два сегмента, где твоё преимущество работает сильнее всего.", "Сформулируй отличие, важное именно этому сегменту, а не всем.", "Перепиши сайт, скрипты продаж и роадмап под это позиционирование."], "pitfall": "Сегментируют по возрасту и полу, хотя выбор в категории объясняют ситуация и задача покупателя."}, {"id": "positioning-statement", "name": "Positioning Statement", "nameRu": "Формула позиционирования в одном предложении", "cat": "brand", "origin": "Джеффри Мур, «Crossing the Chasm», 1991 (формат восходит к Regis McKenna)", "essence": "Загоняет позиционирование в одно предложение с обязательными слотами — пустой слот показывает дыру в стратегии.", "when": "Когда команда описывает продукт по-разному на сайте, в питче и в продажах — нужен один согласованный текст.", "viz": {"type": "grid", "cols": 3, "items": [{"title": "For", "note": "кто клиент, конкретно"}, {"title": "Who", "note": "какая задача или боль"}, {"title": "Is a", "note": "категория для сравнения"}, {"title": "That", "note": "одна ключевая выгода"}, {"title": "Unlike", "note": "главная реальная альтернатива"}, {"title": "Because", "note": "доказательство, почему поверят"}]}, "example": {"company": "Zipcar", "text": "Zipcar формулировал позицию так: для образованных горожан, которым машина нужна изредка, каршеринг вместо владения экономит деньги и снижает углеродный след. В центре не возраст и доход, а ситуация использования."}, "steps": ["Назови целевого клиента конкретно: роль и ситуация, а не «все».", "Опиши задачу или боль словами самого клиента, из интервью.", "Определи категорию, в которой тебя будут сравнивать с другими.", "Сформулируй одну ключевую выгоду вместо списка из пяти.", "Укажи реальную альтернативу и чем именно ты от неё отличаешься.", "Проверь: если конкурент может сказать то же — переписывай."], "pitfall": "В слоте unlike пишут абстрактных конкурентов вместо той альтернативы, которую клиент реально рассматривает сегодня."}, {"id": "perceptual-map", "name": "Perceptual Map", "nameRu": "Карта восприятия брендов по двум осям", "cat": "brand", "origin": "Пол Грин и школа multidimensional scaling, Wharton, 1970-е", "essence": "Показывает, где бренд стоит в голове покупателя относительно конкурентов, а не в презентации маркетолога.", "when": "Когда надо понять, свободна ли ниша, и не воюете ли вы за то же место, что три конкурента.", "viz": {"type": "matrix", "x": {"label": "Цена", "low": "Доступная", "high": "Премиальная"}, "y": {"label": "Образ", "low": "Практичный", "high": "Статусный"}, "cells": [{"title": "Дерзкий выскочка", "note": "статус без премиальной цены"}, {"title": "Классический премиум", "note": "статус, подтверждённый ценой"}, {"title": "Рабочая лошадка", "note": "дёшево и функционально"}, {"title": "Переоценённый", "note": "цена без причины, зона риска"}]}, "example": {"company": "Toyota (Lexus)", "text": "Toyota увидела на карте пустую зону: немецкий премиум держал статус, японские марки — надёжность и цену. В 1989 году Lexus LS 400 вошёл именно туда: премиальный уровень за заметно меньшие деньги."}, "steps": ["Собери атрибуты выбора из интервью, отзывов и поисковых запросов.", "Отбери две оси, которые реально разводят бренды в голове клиента.", "Опроси аудиторию и расставь конкурентов по её оценкам, не своим.", "Найди пустые зоны и проверь, есть ли там платящий спрос.", "Выбери позицию, которую удержишь продуктом, ценой и дистрибуцией."], "pitfall": "Оси берут из головы, а не из речи покупателей — карта красивая, но реальный выбор не описывает."}, {"id": "brand-pyramid", "name": "Brand Key / Brand Pyramid", "nameRu": "Пирамида бренда от атрибутов к сути", "cat": "brand", "origin": "Unilever, модель Brand Key, 1990-е", "essence": "Поднимает бренд от осязаемых атрибутов до одной фразы-сути, где каждый уровень вытекает из нижнего.", "when": "Когда нужна зафиксированная платформа бренда, чтобы агентства, продукт и продажи говорили об одном и том же.", "viz": {"type": "pyramid", "levels": [{"label": "Суть бренда", "note": "одна фраза, ядро смысла"}, {"label": "Ценности и личность", "note": "характер и тон голоса"}, {"label": "Эмоциональные выгоды", "note": "что человек чувствует о себе"}, {"label": "Функциональные выгоды", "note": "какую задачу решает продукт"}, {"label": "Атрибуты и RTB", "note": "факты, доказывающие всё выше"}]}, "example": {"company": "Dove", "text": "Dove собран по Brand Key Unilever: атрибут — увлажняющий крем в составе, выгода — кожа не сохнет, эмоция — уверенность в себе, суть — «real beauty». Из сути выросла кампания Real Beauty 2004 года."}, "steps": ["Выпиши атрибуты продукта и факты, которые их доказывают.", "Переведи каждый атрибут в функциональную выгоду на языке клиента.", "Добавь эмоциональные выгоды: что человек чувствует и думает о себе.", "Опиши личность и ценности бренда несколькими точными прилагательными.", "Сожми всё в одну фразу-суть и проверь связку снизу вверх."], "pitfall": "Верхние уровни пишут красивыми словами без опоры на атрибуты: суть ничем в продукте не доказана."}, {"id": "archetypes", "name": "Brand Archetypes", "nameRu": "Двенадцать архетипов характера бренда", "cat": "brand", "origin": "Маргарет Марк и Кэрол Пирсон, «The Hero and the Outlaw», 2001, по Юнгу", "essence": "Даёт бренду устойчивый характер из двенадцати ролей, чтобы коммуникация звучала одинаково во всех каналах.", "when": "Когда тон коммуникации плавает от кампании к кампании и бренд не считывается, если закрыть логотип.", "viz": {"type": "table", "headers": ["Архетип", "Мотив", "Кто носит"], "rows": [["Hero", "Мастерство и преодоление", "Nike"], ["Outlaw", "Сломать правила", "Harley-Davidson"], ["Explorer", "Свобода и поиск", "Jeep"], ["Caregiver", "Забота о других", "Johnson & Johnson"], ["Jester", "Радость момента", "Old Spice"]]}, "example": {"company": "Harley-Davidson", "text": "Harley-Davidson десятилетиями держит архетип Outlaw: свобода, бунт, своё племя. Клуб владельцев H.O.G., узнаваемый звук мотора и татуировки с логотипом делают то, чего не сделает список характеристик мотоцикла."}, "steps": ["Определи глубинный мотив аудитории: контроль, принадлежность, свобода, мастерство.", "Выбери один основной архетип и максимум один поддерживающий.", "Опиши голос: лексика, темы, что бренд никогда не скажет.", "Проверь конкурентов: не занят ли этот архетип в категории.", "Прогони через архетип рекламу, сайт, поддержку и тексты вакансий."], "pitfall": "Архетип выбирают по вкусу команды, а н о верит компания помимо заработка.", "Опиши How: принципы и решения, отличающие вас от других.", "Перечисли What: продукты как следствие Why, а не наоборот.", "Перепиши главный экран сайта в порядке Why → How → What.", "Проверь Why делом: какие решения вы приняли себе в убыток."], "pitfall": "Why сочиняют в переговорной как слоган; если он не меняет решения по продукту и найму — это украшение."}, {"id": "dba", "name": "Distinctive Brand Assets", "nameRu": "Отличительные активы бренда", "cat": "brand", "origin": "Дженни Романюк, Ehrenberg-Bass Institute, «Building Distinctive Brand Assets», 2018", "essence": "Строит набор сигналов — цвет, звук, форма, персонаж, — по которым бренд узнают ещё до названия.", "when": "Когда реклама работает на категорию: ролик помнят, но приписывают лидеру рынка, а не вам.", "viz": {"type": "table", "headers": ["Тип актива", "Пример", "Что даёт"], "rows": [["Цвет", "Tiffany Blue", "узнают издалека без логотипа"], ["Звук", "Джингл Intel", "работает без картинки"], ["Персонаж", "Michelin Man", "переносит бренд между медиа"], ["Форма", "Бутылка Coca-Cola", "узнаётся даже на ощупь"], ["Фраза", "Just Do It, Nike", "живёт в памяти годами"]]}, "example": {"company": "Mastercard", "text": "В 2019 году Mastercard убрал название из логотипа — остались два пересекающихся круга. Компания ссылалась на исследование: около 80% людей узнавали символ без слова. Актив накоплен полувеком неизменного использования."}, "steps": ["Выпиши все сигналы бренда: цвет, шрифт, звук, форма, персонаж.", "Померь fame: сколько людей называют категорию, увидев сигнал.", "Померь uniqueness: сколько называют именно тебя, а не конкурента.", "Оставь два-три сильных актива и ставь их в каждое касание.", "Новые активы вводи рядом со старыми, а не вместо них."], "pitfall": "Айдентику меняют под каждую кампанию: связь «сигнал → бренд» не успевает накопиться и обнуляется."}, {"id": "60-40", "name": "Binet & Field 60/40", "nameRu": "Баланс бренд-билдинга и активации продаж", "cat" ку как ценность для клиента, не выручку.", "Проверь: она растёт, только если пользователю стало лучше.", "Разложи метрику на 3–5 input-метрик по формуле.", "Закрепи каждую input-метрику за конкретной командой.", "Пересматривай состав драйверов раз в полгода, не чаще."], "pitfall": "Берут выручку или общее число регистраций — метрика бодро растёт, пока продукт теряет активных пользователей."}, {"id": "hook", "name": "Hook Model", "nameRu": "Петля привычки: триггер, действие, награда, вклад", "cat": "growth", "origin": "Нир Эяль, книга Hooked, 2014", "essence": "Описывает, как продукт становится привычкой: за несколько проходов внешний триггер сменяется внутренним.", "when": "Когда пользователи возвращаются только после пуша, а без напоминаний о продукте забывают.", "viz": {"type": "cycle", "steps": [{"label": "Trigger", "note": "внешний пуш или внутренняя эмоция"}, {"label": "Action", "note": "простейшее действие ради награды"}, {"label": "Variable Reward", "note": "результат непредсказуем и потому цепляет"}, {"label": "Investment", "note": "вкладывает данные, контент, время"}]}, "example": {"company": "Instagram", "text": "Триггер — уведомление, позже просто скука; действие — открыть и листать; переменная награда — непредсказуемая лента и реакции; вклад — свои посты и подписки, которые делают следующий заход ценнее."}, "steps": ["Найди внутренний триггер: какую эмоцию закрывает продукт.", "Сократи действие до одного тапа без мыслительной нагрузки.", "Сделай награду переменной, но связанной с ожиданием пользователя.", "Проси вклад сразу после награды: данные, контент, настройку.", "Замерь долю запусков без внешнего триггера — это привычка."], "pitfall": "Строят цикл вокруг ценности для компании, а не пользователя: выходит манипуляция и всплеск отписок."}, {"id": "bullseye", "name": "Bullseye Framework", "nameRu": "Поиск рабочего канала трэкшена из девятнадцати", "cat": "growth", "origin": "Гэбриел Вайнберг и Джастин Марес, книга Traction, 2015", "essence": "Заставляет перебрать все девятнадцать каналов дешёвыми тестами и вложить бюджет в единственный работающий.", "when": "Когда канал выбран по привычке и весь бюджет уходит в перегретый перформанс.", "viz": {"type": "layers", "levels": [{"label": "Что возможно", "note": "все 19 каналов трэкшена"}, {"label": "Что вероятно", "note": "шесть гипотез на дешёвый тест"}, {"label": "Что работает", "note": "один канал, туда бюджет"}]}, "example": {"company": "DuckDuckGo", "text": "Вайнберг перебирал каналы для DuckDuckGo и вместо контекстной рекламы, где было не перебить Google, вложился в PR вокруг приватности — включая билборд в Сан-Франциско в 2011 году."}, "steps": ["Выпиши по одной идее для каждого из 19 каналов.", "Отбери шесть, где есть доступ и понятна экономика.", "Прогони дешёвые тесты: одинаковый бюджет и одинаковый срок.", "Сравни каналы по стоимости привлечения, а не охвату.", "Вложи основной бюджет в один победивший канал."], "pitfall": "Тестируют три знакомых канала вместо девятнадцати — внутреннее кольцо повторяет то, что уже делают конкуренты."}, {"id": "retention-curve", "name": "Retention Curve", "nameRu": "Кривая возврата пользователей по когортам", "cat": "growth", "origin": "Кохортный анализ из демографии; в продукте популяризован командой роста Facebook и Эндрю Ченом, 2010-е", "essence": "Показывает, выходит ли возврат на плато: без плато любой рост аудитории временный.", "when": "Когда MAU растёт за счёт новых регистраций и надо понять, остаётся ли кто-нибудь дальше.", "viz": {"type": "curve", "xLabel": "Дни с регистрации", "yLabel": "% активных", "shape": "decay", "points": [{"at": 5, "label": "D1: обрыв"}, {"at": 25, "label": "D7: активация"}, {"at": 50, "label": "D30: ядро"}, {"at": 85, "label": "Плато"}]}, "example": {"company": "Facebook", "text": "Команда роста искала в когортных кривых точку, после которой возврат переставал падать: у дошедших до семи друзей за десять дней кривая выходила на плато. Это стало целью активации."}, "steps": ["Строй кривые по когортам регистрации, а не по общему MAU.", "Определи возврат через ключевое действие, а не вход.", "Смотри, выходит ли кривая на горизонтальное плато.", "Сравни когорты по каналу и первому сценарию использования.", "Найди действие, отличающее плоские когорты от падающих."], "pitfall": "Смотрят усреднённую кривую по всем пользователям — сегмент с плато тонет в массе случайных регистраций."}, {"id": "4p", "name": "4P Marketing Mix", "nameRu": "Товар, цена, место, продвижение", "cat": "money", "origin": "Джером Маккарти, 1960; расширен до 7P (Booms & Bitner, 1981)", "essence": "Раскладывает предложение на четыре рычага, которыми маркетинг реально управляет, и проверяет их на согласованность.", "when": "Когда запускаешь продукт или разбираешь провал продаж и надо понять, какой из рычагов рассинхронизирован с остальными.", "viz": {"type": "grid", "cols": 2, "items": [{"title": "Product", "note": "какую задачу закрывает и чем"}, {"title": "Price", "note": "уровень, скидки, модель оплаты"}, {"title": "Place", "note": "каналы дистрибуции и полка"}, {"title": "Promotion", "note": "одно сообщение и медиамикс"}]}, "example": {"company": "Zara", "text": "Zara держит четыре рычага в одном контуре: цикл от эскиза до полки в две-три недели, средние цены, только собственные магазины в дорогом трафике и почти нулевой рекламный бюджет — витрина и локация работают вместо промо."}, "steps": ["Опиши продукт в терминах задачи клиента, а не характеристик.", "Зафиксируй цену, скидочную политику и модель оплаты одним абзацем.", "Выпиши все каналы дистрибуции и долю продаж каждого.", "Сформулируй одно сообщение и разложи его по медиамиксу.", "Проверь связность: премиум-продукт не живёт на стоковой полке.", "Для услуг добавь 7P: people, process, physical evidence."], "pitfall": "Заполняют четыре ячейки по отдельности, и премиальный продукт уезжает в дискаунтер с вечными промо-скидками."}, {"id": "ltv-cac", "name": "LTV / CAC", "nameRu": "Отношение ценности клиента к стоимости привлечения", "cat": "money", "origin": "Венчурная SaaS-практика: David Skok и Bessemer Venture Partners, около 2011", "essence": "Проверяет, окупается ли покупка клиента: сколько маржи он принесёт против того, сколько стоил.", "when": "Когда решаешь, масштабировать ли канал: открутка растёт, прибыль стоит на месте, и нужен единый критерий.", "viz": {"type": "flow", "steps": [{"label": "ARPU × маржа", "note": "валовая прибыль с клиента в месяц"}, {"label": "Срок жизни", "note": "единица делить на месячный churn"}, {"label": "LTV", "note": "маржа умножить на срок жизни"}, {"label": "CAC", "note": "весь маркетинг делить на новых"}, {"label": "Отношение ≥ 3", "note": "и payback короче года"}]}, "example": {"company": "Blue Apron", "text": "По данным S-1 2017 года аналитики оценили привлечение клиента Blue Apron в $94–169 при том, что заметная часть подписчиков отваливалась за первые месяцы. LTV не догонял затраты, и после IPO капитализация обвалилась в разы."}, "steps": ["Посчитай валовую прибыль с клиента за месяц, а не выручку.", "Возьми месячный churn и получи ожидаемый срок жизни.", "Собери в CAC весь маркетинг: медиа, зарплаты, комиссии, промокоды.", "Раздели LTV на CAC и сравни с порогом 3:1.", "Посчитай payback: за сколько месяцев CAC возвращается маржой.", "Разрежь по каналам и сегментам — средняя цифра врёт."], "pitfall": "Считают LTV по выручке вместо маржи, а в CAC кладут только рекламу без зарплат и скидок."}, {"id": "unit-economics", "name": "Unit Economics", "nameRu": "Экономика одной сделки или клиента", "cat": "money", "origin": "Contribution margin из управленческого учёта 1930-х; термин закрепился в венчурной практике 2010-х", "essence": "Сводит всю компанию к одному юниту: сколько остаётся с одной продажи после переменных затрат.", "when": "Когда выручка растёт, а убыток растёт быстрее, и надо понять, ломается масштаб или сама сделка.", "viz": {"type": "flow", "steps": [{"label": "Цена юнита", "note": "средний чек одной продажи"}, {"label": "− COGS", "note": "прямая function rCycle(v){

    const t=Math.max(0,Math.min(1,(p.at||0)/100)), x=X(t), y=Y(f(t));
    return `<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${x.toFixed(1)}" y2="${H-B}" stroke="var(--line-2)" stroke-width="1" stroke-dasharray="2 2"/>
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7.4" fill="var(--cc)" stroke="var(--surface-2)" stroke-width="1.6"/>
      <text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="central" fill="#fff" style="font-size:8.5px;font-weight:700">${i+1}</text>`;
  }).join('');
  return `<svg class="crv" viewBox="0 0 ${W} ${H}" role="img">
    <text x="2" y="10" text-anchor="start">↑ ${esc(v.yLabel)}</text>
    <line x1="${L}" y1="${H-B}" x2="${W-2}" y2="${H-B}" stroke="var(--line-2)" stroke-width="1"/>
    <line x1="${L}" y1="${T-10}" x2="${L}" y2="${H-B}" stroke="var(--line-2)" stroke-width="1"/>
    <path d="${d}" fill="none" stroke="var(--cc)" stroke-width="2" stroke-linecap="round"/>
    ${pts}
    <text x="${W-2}" y="${H-7}" text-anchor="end">${esc(v.xLabel)} →</text>
  </svg>
  <ul class="legend">${P.map((p,i)=>`<li><b>${i+1}.</b><span>${esc(p.label)}</span></li>`).join('')}</ul>`;
}
const R = {matrix:rMatrix,funnel:rFunnel,pyramid:rPyramid,flow:rFlow,grid:rGrid,table:rTable,cycle:rCycle,layers:rLayers,curve:rCurve};
const renderViz = v => (R[v?.type]||(()=>''))(v);

/* ---------- list ---------- */
function chips(){
  el('chips').innerHTML = CATS.map(c=>{
    const n = CARDS.filter(x=>x.cat===c.k).length;
    return `<button class="chip" data-k="${c.k}" aria-pressed="false" style="color:var(--c-${c.k})">
      <span class="dot"></span><span style="color:var(--ink-2)">${esc(c.n)} ${n}</span></button>`;
  }).join('');
  el('chips').onclick = e=>{
    const b=e.target.closest('.chip'); if(!b) return;
    const k=b.dataset.k;
    active.has(k)?active.delete(k):active.add(k);
    [...el('chips').children].forEach(c=>c.setAttribute('aria-pressed', active.has(c.dataset.k)));
    [...el('chips').children].forEach(c=>{
      c.querySelector('span:last-child').style.color = active.has(c.dataset.k)?'inherit':'var(--ink-2)';
    });
    render();
  };
}
function match(c){
  if(active.size && !active.has(c.cat)) return false;
  if(!query) return true;
  const q=query.toLowerCase();
  return (c.name+' '+c.nameRu+' '+c.essence+' '+c.when+' '+CN[c.cat]+' '+c.example.company+' '+c.origin).toLowerCase().includes(q);
}
function render(){
  view = CARDS.filter(match);
  el('count').textContent = view.length ? `${view.length} ${plural(view.length)}` : '';
  el('grid').innerHTML = view.length ? view.map((c,i)=>`
    <button class="card" data-i="${i}" style="--cc:var(--c-${c.cat})">
      <span class="num">${String(CARDS.indexOf(c)+1).padStart(2,'0')}</span>
      <h3>${esc(c.name)}</h3>
      <p class="ru">${esc(c.nameRu)}</p>
      <p>${esc(c.essence)}</p>
      <span class="tag"><span class="dot"></span>${esc(CN[c.cat])}</span>
    </button>`).join('') : `<p class="empty">Ничего не нашлось. Попробуй другое слово.</p>`;
}
const plural = n => {const a=n%10,b=n%100; return (a===1&&b!==11)?'карточка':((a>=2&&a<=4)&&(b<10||b>=20))?'карточки':'карточек';};

/* ---------- detail ---------- */
function open(i){
  if(i<0||i>=view.length) return;
  idx=i; const c=view[i];
  el('doc').style.setProperty('--cc',`var(--c-${c.cat})`);
  el('doc').innerHTML = `
    <div class="navrow">
      <button class="nb" id="close">✕</button><div class="sp"></div>
      <span class="pos">${i+1} / ${view.length}</span>
      <button class="nb" id="prev" ${i===0?'disabled':''}>←</button>
      <button class="nb" id="next" ${i===view.length-1?'disabled':''}>→</button>
    </div>
    <div class="dochead"><div class="bar"></div>
      <h2>${esc(c.name)}</h2>
      <p class="ru">${esc(c.nameRu)}</p>
      <p class="origin">${esc(CN[c.cat])} · ${esc(c.origin)}</p>
    </div>
    <section><p class="lbl">Суть</p><p class="essence">${esc(c.essence)}</p></section>
    <section><p class="lbl">Когда доставать</p><p class="when">${esc(c.when)}</p></section>
    <section><p class="lbl">Схема</p><div class="viz">${renderViz(c.viz)}</div></section>
    <section><p class="lbl">Как применить</p><ol class="steps">${c.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></section>
    <section><p class="lbl">Пример</p><p class="ex"><b>${esc(c.example.company)}.</b> ${esc(c.example.text)}</p></section>
    <section><p class="lbl">Частая ошибка</p><p class="pit">${esc(c.pitfall)}</p></section>`;
  el('ov').classList.add('on');
  document.body.style.overflow='hidden';
  el('sheet').scrollTop=0;
  el('close').onclick=close; el('prev').onclick=()=>open(idx-1); el('next').onclick=()=>open(idx+1);
}
function close(){el('ov').classList.remove('on');document.body.style.overflow='';idx=-1;}

el('grid').onclick = e=>{const b=e.target.closest('.card'); if(b) open(+b.dataset.i);};
el('ov').onclick = e=>{if(e.target===el('ov')||e.target===el('sheet')) close();};
el('q').oninput = e=>{query=e.target.value.trim();render();};
el('rnd').onclick = ()=>{if(view.length) open(Math.floor(Math.random()*view.length));};
el('theme').onclick = ()=>{
  const d = document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme', d?'light':'dark');
};
document.addEventListener('keydown', e=>{
  if(idx<0){ if(e.key==='/'){e.preventDefault();el('q').focus();} return; }
  if(e.key==='Escape') close();
  if(e.key==='ArrowLeft'&&idx>0) open(idx-1);
  if(e.key==='ArrowRight'&&idx<view.length-1) open(idx+1);
});
if(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)
  document.documentElement.setAttribute('data-theme','dark');

chips(); render();
</script>
</body>
</html>
