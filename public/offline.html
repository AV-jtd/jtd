<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5c3d2e" />
    <title>Нет сети — JustTODOit</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f4ef;
        --fg: #2b2018;
        --muted: #7a6b5d;
        --accent: #5c3d2e;
        --card: #ffffff;
        --border: rgba(92, 61, 46, 0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1410;
          --fg: #f0e9e0;
          --muted: #a89684;
          --accent: #c89b7b;
          --card: #2a201a;
          --border: rgba(255, 255, 255, 0.08);
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      }
      .icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: var(--accent);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
        font-weight: 600;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.5;
        font-size: 15px;
      }
      button {
        appearance: none;
        border: 0;
        background: var(--accent);
        color: #fff;
        font-size: 15px;
        font-weight: 500;
        padding: 12px 20px;
        border-radius: 10px;
        cursor: pointer;
        min-width: 140px;
        transition: opacity 0.15s;
      }
      button:active { opacity: 0.8; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .status {
        margin-top: 14px;
        font-size: 13px;
        color: var(--muted);
        min-height: 18px;
      }
      .online .status { color: #2d7a3e; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card" id="card">
        <div class="icon" aria-hidden="true">📡</div>
        <h1>Нет подключения к сети</h1>
        <p>Похоже, вы оффлайн. Можно продолжать с сохранённой версией, а обновление запустить вручную.</p>
        <button id="retry" type="button">Попробовать снова</button>
        <div class="status" id="status"></div>
      </div>
    </div>
    <script>
      (function () {
        var btn = document.getElementById("retry");
        var status = document.getElementById("status");
        var card = document.getElementById("card");

        function updateOnline() {
          if (navigator.onLine) {
            card.classList.add("online");
            status.textContent = "Сеть доступна — можно попробовать загрузить снова.";
          } else {
            card.classList.remove("online");
            status.textContent = "";
          }
        }

        // На «Попробовать снова» делаем агрессивный escape:
        //   1. Снимаем регистрации service worker (чтобы он не вернул offline.html снова)
        //   2. Чистим Workbox-кэш навигаций
        //   3. Идём на корень с обходом кэша (cache-bust query)
        // Это нужно, потому что при кратковременном сбое сети SW мог закэшировать
        // offline.html как ответ на навигацию, и обычный reload крутит её по кругу.
        btn.addEventListener("click", async function () {
          btn.disabled = true;
          status.textContent = "Восстанавливаем соединение…";
          try {
            if ("serviceWorker" in navigator) {
              var regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(function (r) { return r.unregister(); }));
            }
            if (window.caches && caches.keys) {
              var keys = await caches.keys();
              await Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }
          } catch (e) {
            // best-effort
          }
          // Принудительный заход на корень в обход bfcache/SW-навигации.
          window.location.replace("/?_=" + Date.now());
        });

        window.addEventListener("online", updateOnline);
        window.addEventListener("offline", updateOnline);
        // Initial check (in case navigator.onLine flipped before script ran).
        updateOnline();

        // Если сеть вернулась, пока пользователь смотрит на эту страницу,
        // и пользователь не нажал кнопку 5 секунд — выводим пользователя сами.
        var autoRecoverTimer = null;
        window.addEventListener("online", function () {
          if (autoRecoverTimer) return;
          autoRecoverTimer = setTimeout(function () {
            // Авто-эскейп через тот же путь, что и кнопка.
            btn.click();
          }, 5000);
        });
      })();
    </script>
  </body>
</html>
