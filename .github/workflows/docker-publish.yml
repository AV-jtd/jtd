name: Build & Push Docker image

on:
  push:
    branches: [main]
    workflow_dispatch:

env:
  IMAGE: ghcr.io/av-jtd/jtd

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/av-jtd/jtd:latest
            ghcr.io/av-jtd/jtd:${{ github.sha }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_SUPABASE_PROXY_URL=${{ secrets.VITE_SUPABASE_PROXY_URL }}

      # Мгновенное обновление стека в Portainer после пуша образа.
      # Нужно: в Portainer → Stack → включить Webhook → скопировать URL
      # в GitHub Secrets как PORTAINER_WEBHOOK_URL.
      - name: Trigger Portainer stack update
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        if: env.PORTAINER_WEBHOOK_URL != ''
        run: curl -s -X POST "$PORTAINER_WEBHOOK_URL"
