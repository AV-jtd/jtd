server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # React SPA — все маршруты на index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        # Включаем same-origin /sb прокси для self-hosted билда.
        # Lovable CDN не имеет /sb/ — там этот флаг не выставляется и клиент идёт напрямую в Supabase.
        sub_filter '<head>' '<head><script>window.__SB_PROXY__=true;</script>';
        sub_filter_once on;
        sub_filter_types text/html;
    }

    # Статика с хэшами в именах — кэшируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Supabase Realtime WebSocket — должен быть ВЫШЕ location /sb/
    location /sb/realtime/ {
        proxy_pass https://nvfioycpwyzwukvokwql.supabase.co/realtime/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host nvfioycpwyzwukvokwql.supabase.co;
        proxy_ssl_server_name on;
        proxy_read_timeout 86400;
    }

    # Supabase REST / Auth / Storage
    location /sb/ {
        # Preflight OPTIONS — отвечаем сразу
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Headers *;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }

        proxy_pass https://nvfioycpwyzwukvokwql.supabase.co/;
        proxy_ssl_server_name on;
        proxy_set_header Host nvfioycpwyzwukvokwql.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Headers * always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        add_header Access-Control-Expose-Headers * always;
    }
}
