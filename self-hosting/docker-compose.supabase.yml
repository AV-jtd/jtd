# Supabase self-hosted stack
# Источник: https://github.com/supabase/supabase/tree/master/docker
# Адаптировано для justtodoit.ru на российском VPS
#
# Запуск:
#   cp self-hosting/.env.supabase.example self-hosting/.env.supabase
#   # заполни .env.supabase своими значениями
#   docker compose -f self-hosting/docker-compose.supabase.yml --env-file self-hosting/.env.supabase up -d

version: "3.8"

services:
  db:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
      # Init-скрипт задаёт пароли внутренних пользователей Supabase
      - ./db-init/roles.sql:/docker-entrypoint-initdb.d/99-roles.sql:ro
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  vector:
    image: timberio/vector:0.28.1-alpine
    restart: unless-stopped
    volumes:
      - ./vector.yml:/etc/vector/vector.yaml:ro
    depends_on:
      - db

  auth:
    image: supabase/gotrue:v2.164.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: JustTODOit
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  realtime:
    image: supabase/realtime:v2.30.34
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      # Должен быть ровно 16 байт (AES-128-ECB) — JWT_SECRET (44 символа)
      # не подходит по длине, даёт "Bad key size" при создании тенанта.
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILSCALE: "false"
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      FLY_ALLOC_ID: fly123
      FLY_APP_NAME: realtime
    ulimits:
      nofile:
        soft: 10000
        hard: 10000

  storage:
    image: supabase/storage-api:v1.11.13
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: ${STORAGE_FILE_SIZE_LIMIT:-52428800}
      ENABLE_IMAGE_TRANSFORMATION: "true"
      TENANT_ID: stub
      # --- Бэкенд: file (по умолчанию) или s3 ---
      # Для S3: задай STORAGE_BACKEND=s3 и заполни S3_* переменные в .env.supabase
      STORAGE_BACKEND: ${STORAGE_BACKEND:-file}
      # file-бэкенд
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      # s3-бэкенд (игнорируется при STORAGE_BACKEND=file)
      GLOBAL_S3_BUCKET: ${STORAGE_S3_BUCKET:-stub}
      GLOBAL_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      GLOBAL_S3_REGION: ${STORAGE_S3_REGION:-ru-1}
      GLOBAL_S3_FORCE_PATH_STYLE: ${STORAGE_S3_FORCE_PATH_STYLE:-true}
      AWS_ACCESS_KEY_ID: ${STORAGE_S3_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET:-}
      # AWS SDK v3 для некоторых батч-операций (deleteObjects) требует region
      # именно в этой переменной, GLOBAL_S3_REGION ему не подхватывается —
      # без неё падает "Region is missing" при загрузке файлов (2026-08-14)
      AWS_REGION: ${STORAGE_S3_REGION:-ru-1}
    volumes:
      # file-бэкенд: том для локального хранения
      # при s3-бэкенде том не используется, но остаётся для возможного отката
      - storage_data:/var/lib/storage

  edge-runtime:
    image: supabase/edge-runtime:v1.65.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../supabase/functions:/home/deno/functions:ro
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      # Секреты edge functions:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      LOVABLE_API_KEY: ${LOVABLE_API_KEY}
      # AI-функции переведены на OpenRouter (LOVABLE_API_KEY больше не
      # используется в коде, но оставлен для обратной совместимости)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # Мессенджер MAX (значение — только в .env.supabase, не в git)
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
      # Публичный домен — используется функциями для self-registration
      # вебхуков (telegram-webhook/max-webhook "setup_webhook"), чтобы не
      # хардкодить старый cloud-домен Lovable прямо в коде.
      SITE_URL: ${SITE_URL}
    command:
      - start
      - --main-service
      - /home/deno/functions/main

  meta:
    image: supabase/postgres-meta:v0.84.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      # Собственный (внутренний) nginx Kong читает входящие запросы клиента
      # с дефолтными буферами (client_header_buffer_size ~1k, large_client_header_buffers 4 8k) —
      # этого не хватает для длинных URL вида task_id=in.(...много UUID...),
      # даёт 414 Request-URI Too Large ещё до того, как запрос доходит до PostgREST.
      KONG_NGINX_HTTP_LARGE_CLIENT_HEADER_BUFFERS: "8 256k"
      KONG_NGINX_HTTP_CLIENT_HEADER_BUFFER_SIZE: 256k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    volumes:
      - ./kong.yml:/var/lib/kong/kong.yml:ro
    ports:
      - "8000:8000"

  # nginx: фронтенд + проксирование /sb/ → kong
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - kong
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-full.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ../dist:/usr/share/nginx/html:ro

  # ---------- Бэкапы ----------
  # Ежедневный бэкап PostgreSQL с автоматической ротацией.
  # Для включения раскомментируй и задай BACKUP_DIR в .env.supabase
  pg-backup:
    image: postgres:15-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
    volumes:
      - backup_data:${BACKUP_DIR:-/backups}
      - ./backup/backup-entrypoint.sh:/backup-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/backup-entrypoint.sh"]
    # Примонтировать внешний диск вместо тома для реального продакшна:
    # - /mnt/backup-disk/jtd:/backups

volumes:
  db_data:
  storage_data:
  backup_data:
