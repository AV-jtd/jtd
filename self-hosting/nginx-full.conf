server {
    listen 80;
    listen [::]:80;
    server_name justtodoit.ru www.justtodoit.ru;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name justtodoit.ru www.justtodoit.ru;

    ssl_certificate     /etc/letsencrypt/live/justtodoit.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/justtodoit.ru/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # PostgREST/Kong запросы вида task_id=in.(...) с сотнями UUID дают очень
    # длинные строки запроса и заголовки ответа — дефолтных буферов nginx
    # (4-8k) не хватает, получаем "upstream sent too big header" -> 502
    # либо (на входящем запросе) 414 Request-URI Too Large.
    # Kong-у нужен тот же тюнинг для ЕГО собственного встроенного nginx —
    # см. KONG_NGINX_HTTP_LARGE_CLIENT_HEADER_BUFFERS в docker-compose.
    large_client_header_buffers 8 256k;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /sb/ {
        proxy_pass http://kong:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffer_size 160k;
        proxy_buffers 64 160k;
        proxy_busy_buffers_size 160k;
    }

    location /functions/ {
        proxy_pass http://kong:8000/functions/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
