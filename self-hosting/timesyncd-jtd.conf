# Синхронизация времени для jtd. Ставится в /etc/systemd/timesyncd.conf.d/.
#
# Зачем: 11 сентября 2026 системные часы отстали на 4 часа 39 минут, pg_cron
# отработал пятничные рассылки по отставшим часам, и они ушли не вовремя.
# systemd-timesyncd в этот момент был выключен и в конфиге по умолчанию ходил
# только в ntp.ubuntu.com — а провайдер режет UDP/123 почти везде.
#
# bash self-hosting/check-ntp.sh проверил семь серверов: отвечает ровно один,
# time.cloudflare.com (anycast, stratum 3, rtt 1-2 мс). Остальные — таймаут.
# Поэтому список короткий и других вариантов в нём нет; проверять заново имеет
# смысл тем же скриптом, если Cloudflare когда-нибудь замолчит.
#
# FallbackNTP — те же серверы по IP, на случай если сломается DNS: без них
# timesyncd откатится на вшитый ntp.ubuntu.com, который здесь недоступен.
#
# Установка:
#   mkdir -p /etc/systemd/timesyncd.conf.d
#   cp /opt/jtd/self-hosting/timesyncd-jtd.conf /etc/systemd/timesyncd.conf.d/
#   systemctl enable --now systemd-timesyncd
#   timedatectl timesync-status
#
# Проверка: timedatectl  →  "System clock synchronized: yes"

[Time]
NTP=time.cloudflare.com
FallbackNTP=162.159.200.1 162.159.200.123

# Часы уже уезжали разово при паузе/переносе виртуальной машины, причём вместе
# с аппаратными. Короткий интервал опроса — чтобы такой скачок ловился за
# минуты, а не за часы: стандартный максимум у timesyncd больше суток.
PollIntervalMinSec=32
PollIntervalMaxSec=1024
